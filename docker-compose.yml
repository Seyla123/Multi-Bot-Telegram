services:
  mysql:
    image: mysql:8.0
    container_name: nest_mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: nest_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: nest_user
      MYSQL_PASSWORD: secretpassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nest_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
