<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nest Learn - Telegram Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-chat: #0b1120;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --msg-in: #1e293b;
            --msg-out: #3b82f6;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 1.2rem;
        }
        .user-list {
            flex: 1;
            overflow-y: auto;
        }
        .user-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .user-item:hover { background-color: rgba(255,255,255,0.05); }
        .user-item.active { background-color: var(--accent); }
        .user-name { font-weight: 500; }
        .user-username { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
        .user-item.active .user-username { color: #bfdbfe; }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
        }
        .chat-header {
            padding: 1.5rem;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            display: flex;
            align-items: center;
        }
        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            line-height: 1.4;
        }
        .message.incoming {
            background-color: var(--msg-in);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.outgoing {
            background-color: var(--msg-out);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-time {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 0.25rem;
            text-align: right;
        }

        /* Input Area */
        .chat-input-area {
            padding: 1.5rem;
            background-color: var(--bg-sidebar);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 1rem;
        }
        .chat-input {
            flex: 1;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: inherit;
            outline: none;
        }
        .chat-input:focus {
            border-color: var(--accent);
        }
        .btn-send {
            padding: 0 2rem;
            border: none;
            border-radius: 8px;
            background-color: var(--accent);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-send:hover { background-color: var(--accent-hover); }
        .btn-send:disabled { background-color: var(--border); cursor: not-allowed; }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-muted);
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            Chats
        </div>
        <div class="user-list" id="user-list">
            <!-- Users will be injected here -->
        </div>
    </div>

    <div class="chat-area" id="chat-area" style="display: none;">
        <div class="chat-header" id="chat-header-name">
            Select a user
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages injected here -->
        </div>
        <form class="chat-input-area" id="chat-form">
            <input type="text" id="message-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="btn-send" id="send-btn">Send</button>
        </form>
    </div>
    
    <div class="chat-area" id="empty-area">
        <div class="empty-state">Select a chat to start messaging</div>
    </div>

    <script>
        let currentUser = null;
        let pollInterval = null;
        let isScrolledToBottom = true;

        async function fetchUsers() {
            try {
                const res = await fetch('/telegram/users');
                const users = await res.json();
                renderUsers(users);
            } catch (err) {
                console.error("Error fetching users:", err);
            }
        }

        function renderUsers(users) {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            users.forEach(user => {
                const div = document.createElement('div');
                div.className = `user-item ${currentUser && currentUser.id === user.id ? 'active' : ''}`;
                div.onclick = () => selectUser(user);
                
                const name = document.createElement('div');
                name.className = 'user-name';
                name.innerText = user.firstName + (user.lastName ? ` ${user.lastName}` : '');
                
                const username = document.createElement('div');
                username.className = 'user-username';
                username.innerText = user.username ? `@${user.username}` : user.telegramId;

                div.appendChild(name);
                div.appendChild(username);
                list.appendChild(div);
            });
        }

        async function selectUser(user) {
            currentUser = user;
            
            document.getElementById('empty-area').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('chat-header-name').innerText = user.firstName;
            document.getElementById('message-input').focus();
            isScrolledToBottom = true; // force scroll on switch

            // Re-render users to update active class
            fetchUsers();
            
            await fetchMessages();

            // Start polling
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(fetchMessages, 3000);
        }

        async function fetchMessages() {
            if (!currentUser) return;
            try {
                const res = await fetch(`/telegram/messages/${currentUser.id}`);
                const messages = await res.json();
                renderMessages(messages);
            } catch (err) {
                console.error("Error fetching messages:", err);
            }
        }

        function renderMessages(messages) {
            const container = document.getElementById('chat-messages');
            
            // Check if we need to scroll to bottom (if user is already at bottom)
            if (container.scrollHeight > 0) {
                isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
            }

            container.innerHTML = '';
            
            if (messages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color: var(--text-muted); margin-top: 2rem;">No messages yet. Say hi!</div>';
                return;
            }

            messages.forEach(msg => {
                const div = document.createElement('div');
                const isOutgoing = msg.status === 'sent';
                div.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
                
                let text = msg.text || '';
                // basic JSON parse if text contains file payload
                if (text.startsWith('{')) {
                    try {
                        const parsed = JSON.parse(text);
                        text = `[Media: ${msg.messageType}]`;
                    } catch(e) {}
                }

                div.innerText = text;

                const time = document.createElement('div');
                time.className = 'message-time';
                time.innerText = new Date(msg.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                div.appendChild(time);

                container.appendChild(div);
            });

            if (isScrolledToBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }

        document.getElementById('chat-messages').addEventListener('scroll', (e) => {
             const container = e.target;
             isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 50;
        });

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const btn = document.getElementById('send-btn');
            
            input.value = '';
            btn.disabled = true;
            isScrolledToBottom = true;

            try {
                const res = await fetch(`/telegram/messages/${currentUser.id}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text,
                        telegramId: currentUser.telegramId
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    await fetchMessages();
                } else {
                    alert("Failed to send message: " + data.message);
                }
            } catch (err) {
                console.error("Send error:", err);
                alert("Failed to send message.");
            } finally {
                btn.disabled = false;
                input.focus();
            }
        });

        // Init
        fetchUsers();
    </script>
</body>
</html>
